# Cấu hình Supabase local — dùng cho `npx supabase start`.
#
# KHÔNG dùng cho production. Production được cấu hình qua Supabase Dashboard.
# Mục đích của file này: chạy toàn bộ stack (Postgres + Auth + Storage) trên
# máy để test migration và RLS trước khi đưa lên bất cứ đâu.

project_id = "wordly"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

# Bắt email test lại, không gửi thật khi chạy local.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local: tắt xác minh email để test nhanh, không phải mở Inbucket mỗi lần.
enable_confirmations = false

# ══════════════════════════════════════════════════════════════════════════════
# Custom Access Token Hook — MẤU CHỐT của multi-tenancy
#
# Hook này nhúng claim `user_orgs` = { org_id: role } vào JWT. Toàn bộ RLS
# đọc từ claim đó thay vì query bảng (tránh chậm + đệ quy vô hạn).
#
# Không bật hook thì `user_orgs` rỗng → mọi policy chặn hết → hệ thống trông
# như "không có quyền gì cả". Đây là chỗ dễ quên nhất khi dựng môi trường mới.
#
# Trên production: bật tay ở Dashboard → Authentication → Hooks →
# Custom Access Token, trỏ tới public.custom_access_token_hook.
# ══════════════════════════════════════════════════════════════════════════════
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
