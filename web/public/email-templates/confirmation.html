<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#3C3C3C">
  <h2 style="margin:0 0 12px;font-size:20px">Xác nhận email Wordly</h2>
  <p style="margin:0 0 16px;font-size:15px;line-height:1.5">Mã xác nhận của bạn (nhập trong app Wordly):</p>
  <p style="margin:0 0 20px;font-size:32px;font-weight:800;letter-spacing:6px;color:#58A700">{{ .Token }}</p>
  <p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#777777">Đăng ký trên web? Bấm nút dưới để xác nhận:</p>
  <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/" style="display:inline-block;background:#58CC02;color:#FFFFFF;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px">Xác nhận email</a></p>
  <p style="margin:0;font-size:13px;line-height:1.5;color:#AFAFAF">Xác nhận xong, mở app Wordly và đăng nhập bằng email, mật khẩu vừa tạo. Nếu bạn không tạo tài khoản Wordly, hãy bỏ qua email này.</p>
</div>
