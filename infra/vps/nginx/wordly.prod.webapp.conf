server {
    server_name app.wordly.skillproof.work;
    # Ảnh dịch gửi base64 (/api/translate/image) — base64 phình ~33%, 10MB ảnh
    # ~13.4MB JSON. 1m cũ chặn luôn cả ảnh 5MB trước đây, không riêng bản 10MB này.
    client_max_body_size 15m;
    location / {
        proxy_pass http://wordly_web;   # upstream ở /etc/nginx/conf.d/wordly-upstream.conf (blue/green)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.wordly.skillproof.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.wordly.skillproof.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.wordly.skillproof.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name app.wordly.skillproof.work;
    listen 80;
    return 404; # managed by Certbot


}