# Sinh WordlyiOS.xcodeproj bằng XcodeGen:  brew install xcodegen && xcodegen generate
# .xcodeproj là file sinh ra (gitignore) — sửa cấu hình ở đây, không sửa trong Xcode.
name: WordlyiOS
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "23"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  # Chỉ FirebaseMessaging (push) — không Analytics/Crashlytics
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  # Quảng cáo (spec 2026-10-23-in-app-ads-design.md) — kèm UMP (đồng ý GDPR)
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
targets:
  WordlyiOS:
    type: application
    platform: iOS
    sources:
      - path: WordlyiOS
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
    # XcodeGen GHI ĐÈ Info.plist / entitlements từ `properties` dưới đây —
    # sửa ở đây, không sửa file plist trực tiếp.
    info:
      path: WordlyiOS/App/Info.plist
      properties:
        CFBundleDisplayName: Wordly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App tiếng Việt → nút hệ thống (Sign in with Apple, DatePicker…) hiện tiếng Việt
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations: [vi]
        # Cấu hình từ Config/*.xcconfig — đọc qua WordlyConfig
        WordlyWebBaseURL: $(WORDLY_WEB_BASE_URL)
        WordlySupabaseURL: $(WORDLY_SUPABASE_URL)
        WordlySupabaseAnonKey: $(WORDLY_SUPABASE_ANON_KEY)
        WordlyAppGroup: $(WORDLY_APP_GROUP)
        # Plus Jakarta Sans — font của web (Resources/Fonts, giấy phép OFL)
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        # App chỉ dùng HTTPS chuẩn của hệ điều hành → không phải khai báo xuất khẩu mã hoá
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Wordly dùng mic để bạn nói rồi dịch ngay câu vừa nói."
        NSSpeechRecognitionUsageDescription: "Wordly nhận dạng giọng nói ngay trên máy để chuyển lời bạn nói thành chữ rồi dịch."
        NSCameraUsageDescription: "Wordly cần camera để chụp ảnh và dịch chữ trong ảnh."
        # com.thientran.wordly://login-callback — Google OAuth (Supabase) quay về app
        CFBundleURLTypes:
          - CFBundleURLSchemes: [wordly, $(WORDLY_BUNDLE_ID)]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # Tự chuyển APNs token cho Firebase (PushManager) — không cho Firebase
        # chen vào AppDelegate/onOpenURL (swizzling)
        FirebaseAppDelegateProxyEnabled: false
        # Quảng cáo AdMob — ID trong Config/*.xcconfig (Base: ID test của Google)
        GADApplicationIdentifier: $(WORDLY_ADMOB_APP_ID)
        WordlyAdUnitAppOpen: $(WORDLY_AD_UNIT_APP_OPEN)
        WordlyAdUnitBanner: $(WORDLY_AD_UNIT_BANNER)
        WordlyAdUnitInterstitial: $(WORDLY_AD_UNIT_INTERSTITIAL)
        WordlyAdUnitRewarded: $(WORDLY_AD_UNIT_REWARDED)
        NSUserTrackingUsageDescription: "Wordly dùng để quảng cáo phù hợp hơn với bạn. Từ chối thì vẫn có quảng cáo nhưng ít liên quan hơn."
        # Danh sách chính thức của Google (developers.google.com/admob/ios/quick-start, 23/10/2026)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
