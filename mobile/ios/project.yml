    entitlements:
      path: WordlyiOS/App/WordlyiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WORDLY_APP_GROUP)
        # Sign in with Apple (bắt buộc khi có đăng nhập Google — App Store 4.8)
        com.apple.developer.applesignin:
          - Default
        # Push Notifications — development (Debug) / production (Release, TestFlight)
        aps-environment: $(WORDLY_APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDLY_BUNDLE_ID)
        PRODUCT_NAME: Wordly
        # Icon lấy từ web/public (bản vuông tràn nền, không alpha — iOS tự bo góc)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          WORDLY_APS_ENVIRONMENT: development
        Release:
          WORDLY_APS_ENVIRONMENT: production
    dependencies:
      - package: Supabase
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMobileAds
      - target: WordlyWidget
    scheme:
      testTargets:
        - WordlyiOSTests
        - WordlyiOSUITests
  WordlyiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WordlyiOSTests
    dependencies:
      - target: WordlyiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDLY_BUNDLE_ID).tests
        # App có PRODUCT_NAME = Wordly, không phải tên target
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wordly.app/Wordly
        BUNDLE_LOADER: $(TEST_HOST)
  # UI test — chạy app ở chế độ xem trước (Debug), máy tự chạm/gõ để kiểm hành vi
  WordlyiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WordlyiOSUITests
    dependencies:
      - target: WordlyiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDLY_BUNDLE_ID).uitests
        TEST_TARGET_NAME: WordlyiOS
  WordlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WordlyWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      # Dùng chung bảng màu + font + lịch hiển thị widget với app
      - path: WordlyiOS/Shared/Theme/DesignSystem.swift
      - path: WordlyiOS/Shared/Widget/WidgetSchedule.swift
      - path: WordlyiOS/Shared/Widget/WidgetBackgroundImage.swift
      - path: WordlyiOS/Shared/Widget/WidgetCopy.swift
      - path: WordlyiOS/Shared/Widget/WordSource.swift
      - path: WordlyiOS/Resources/Fonts
        buildPhase: resources
      - path: WordlyiOS/Resources/Brand.xcassets
    info:
      path: WordlyWidget/Info.plist
      properties:
        CFBundleDisplayName: Wordly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WordlyAppGroup: $(WORDLY_APP_GROUP)
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WordlyWidget/WordlyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WORDLY_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDLY_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
