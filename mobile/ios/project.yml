# Sinh WordlyiOS.xcodeproj bằng XcodeGen:  brew install xcodegen && xcodegen generate
# .xcodeproj là file sinh ra (gitignore) — sửa cấu hình ở đây, không sửa trong Xcode.
name: WordlyiOS
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  WordlyiOS:
    type: application
    platform: iOS
    sources:
      - path: WordlyiOS
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
    # XcodeGen GHI ĐÈ Info.plist / entitlements từ `properties` dưới đây —
    # sửa ở đây, không sửa file plist trực tiếp.
    info:
      path: WordlyiOS/App/Info.plist
      properties:
        CFBundleDisplayName: Wordly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Cấu hình từ Config/*.xcconfig — đọc qua WordlyConfig
        WordlyWebBaseURL: $(WORDLY_WEB_BASE_URL)
        WordlySupabaseURL: $(WORDLY_SUPABASE_URL)
        WordlySupabaseAnonKey: $(WORDLY_SUPABASE_ANON_KEY)
        WordlyAppGroup: $(WORDLY_APP_GROUP)
        # App chỉ dùng HTTPS chuẩn của hệ điều hành → không phải khai báo xuất khẩu mã hoá
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Wordly cần mic để luyện nói với Alex — giáo viên AI của bạn."
        NSSpeechRecognitionUsageDescription: "Wordly dùng nhận dạng giọng nói để chuyển lời nói của bạn thành văn bản khi luyện nói với Alex."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [wordly]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    entitlements:
      path: WordlyiOS/App/WordlyiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WORDLY_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDLY_BUNDLE_ID)
        PRODUCT_NAME: Wordly
        # Icon lấy từ web/public (bản vuông tràn nền, không alpha — iOS tự bo góc)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Supabase
      - target: WordlyWidget
    scheme:
      testTargets:
        - WordlyiOSTests
  WordlyiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WordlyiOSTests
    dependencies:
      - target: WordlyiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDLY_BUNDLE_ID).tests
        # App có PRODUCT_NAME = Wordly, không phải tên target
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wordly.app/Wordly
        BUNDLE_LOADER: $(TEST_HOST)
  WordlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WordlyWidget
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: WordlyWidget/Info.plist
      properties:
        CFBundleDisplayName: Wordly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WordlyAppGroup: $(WORDLY_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WordlyWidget/WordlyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WORDLY_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDLY_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
