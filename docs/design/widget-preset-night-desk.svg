    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eb8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eb8ff" stop-opacity="0"/>
