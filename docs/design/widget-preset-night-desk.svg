    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc56b" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff9f43" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
